name: FinVelayudham CI/CD Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Run sync check every 6 hours
    - cron: '0 */6 * * *'

jobs:
  test-and-build:
    name: Test & Build Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Next.js Production Application
        run: npm run build

      - name: Start Next.js Test Server
        run: |
          npx next start -p 3005 &
          sleep 4

      - name: Run Automated Test Suite
        run: npm test
        env:
          TEST_BASE_URL: http://127.0.0.1:3005

      - name: Run Upstream Drift Check (Non-blocking)
        run: npm run sync:check || echo "Upstream sync check completed with warnings"
        env:
          REFERENCE_URL: https://www.finboom.app
          TARGET_URL: https://www.finvelayudham.app
